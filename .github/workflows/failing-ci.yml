name: failing-ci

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  failing-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run app
        run: |
           python app.py
      
      - name: Run tests
        run: |
          echo "Running tests..."
          python tests/test_app.py
